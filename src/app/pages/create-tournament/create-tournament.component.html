<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card text-bg-dark border-secondary shadow">
                <div class="card-header border-secondary">
                    <h3 class="mb-0">Create New Tournament</h3>
                </div>
                <div class="card-body">
                    <form (ngSubmit)="onSubmit()" #tournamentForm="ngForm">
                        <div class="mb-3">
                            <label for="tournamentName" class="form-label text-light">Tournament Name</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary"
                                id="tournamentName" name="tournamentName" [(ngModel)]="tournamentName" required
                                placeholder="Enter tournament name" [disabled]="isSubmitting">
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-outline-secondary" (click)="onCancel()"
                                [disabled]="isSubmitting">Cancel</button>
                            <button type="submit" class="btn btn-primary"
                                [disabled]="!tournamentForm.form.valid || isSubmitting">
                                <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1" role="status"
                                    aria-hidden="true"></span>
                                Create Tournament
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
