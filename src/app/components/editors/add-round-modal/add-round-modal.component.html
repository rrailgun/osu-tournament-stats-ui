<div class="modal fade" [class.show]="visible" [style.display]="visible ? 'block' : 'none'"
  tabindex="-1" aria-labelledby="add-round-title" [attr.aria-hidden]="!visible">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="add-round-title">Add Round</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="onClose()"></button>
      </div>

      <div class="modal-body">
        <div class="mb-3">
          <label for="roundName" class="form-label">Round Name</label>
          <input id="roundName" type="text" class="form-control" name="roundName" [(ngModel)]="newRoundName"
            placeholder="e.g. Quarterfinals" (keyup.enter)="onAdd()" />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="onClose()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="onAdd()"
          [disabled]="isLoading || !newRoundName.trim()">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status"
            aria-hidden="true"></span>
          Add
        </button>
      </div>

    </div>
  </div>
</div>

<!-- BACKDROP -->
<div *ngIf="visible" class="modal-backdrop fade show"></div>
